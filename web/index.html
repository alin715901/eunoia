<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Eunoia</title>
    <!-- PWA：可「添加到主屏幕」，独立窗口中后台播放音乐更稳定。
         相对路径：GitHub Pages /<仓库名>/ 子路径部署同样有效 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <meta name="theme-color" content="#c5a47e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eunoia" />
    <script>
      /* 首屏先按上次选择的外观上色，避免深色模式启动时闪一下白屏 */
      (function () {
        try {
          var m = localStorage.getItem('zika.appearance') || 'light';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var t = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <!-- 运行时配置（public/config.js）：用相对路径，GitHub Pages 子路径部署同样有效。
         module 脚本是延迟执行的，本标签先于它跑完，main.js 里即可同步读 window.__EUNOIA_CONFIG__ -->
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- 静态启动画面：JS 下载/解析期间显示（Vue 挂载后被骨架屏无缝替换）。
           样式内联且跟随 index.html 已有的深浅色预上色逻辑，避免深色模式闪白 -->
      <div class="boot-static">
        <div class="boot-brand">Eunoia</div>
        <div class="boot-heart">
          <svg viewBox="0 0 32 29" width="34" height="30" aria-hidden="true">
            <path d="M16 28.5S1.5 19.6 1.5 9.9C1.5 4.9 5.5 1.5 9.6 1.5c2.7 0 5.2 1.3 6.4 3.4 1.2-2.1 3.7-3.4 6.4-3.4 4.1 0 8.1 3.4 8.1 8.4 0 9.7-14.5 18.6-14.5 18.6z"/>
          </svg>
        </div>
        <div class="boot-text">正在打开…</div>
      </div>
    </div>
    <style>
      .boot-static {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #f7f3ee;
        font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
      }
      [data-theme="dark"] .boot-static { background: #141416; }
      .boot-brand { font-size: 30px; font-weight: 700; letter-spacing: 0.12em; color: #c5a47e; }
      .boot-heart svg path { fill: #c5a47e; animation: bootBeat 1.2s ease-in-out infinite; transform-origin: center 60%; }
      .boot-text { font-size: 13px; color: #8e8e93; letter-spacing: 0.06em; }
      [data-theme="dark"] .boot-text { color: #9b9ba3; }
      @keyframes bootBeat {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        14% { transform: scale(1.18); opacity: 1; }
        28% { transform: scale(1); opacity: 0.85; }
        42% { transform: scale(1.12); opacity: 1; }
        70% { transform: scale(1); opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-heart svg path { animation: none; } }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

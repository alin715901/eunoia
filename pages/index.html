<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eunoia 音乐代理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f7f5f2; color: #333; }
    .card { max-width: 420px; padding: 28px; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.06); text-align: center; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    p { font-size: 13px; line-height: 1.8; color: #888; margin: 0; }
    code { display: inline-block; margin-top: 12px; padding: 6px 10px; background: #f2f0ed; border-radius: 6px; font-size: 12px; color: #a07f57; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Eunoia 音乐代理运行中</h1>
    <p>本页面是中转服务的首页，不需要打开。<br />把它分配给 Eunoia 的 config.js 即可。</p>
    <code>GET /?url=&lt;目标地址&gt;</code>
  </div>
</body>
</html>

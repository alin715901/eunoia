name: Build Android APK

# 推送到 main 或手动触发 → 构建 Vue 网页 → 同步进 Capacitor 安卓工程 → 编译 APK → 上传到 Releases
# 产物：GitHub Releases 里的 eunoia.apk（debug，可直接装到手机）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 用于创建/更新 Releases 与 tag

# 同一时间只跑一个 APK 构建，新的触发会取消排队中的旧任务
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install web dependencies
        run: npm ci

      - name: Build web (relative base for APK)
        # build:apk = vite build --base=./ + 写入 version.json，路径用相对基，适配 Capacitor 加载
        run: npm run build:apk

      - name: Copy web build into native project
        # cap copy 只把 dist 拷贝进 android/app/src/main/assets/public，不重建、不动插件
        run: npx cap copy android

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk eunoia.apk

      - name: Publish to GitHub Releases (rolling latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eunoia-apk
          name: Eunoia字卡 APK（最新）
          body: |
            🤖 自动构建的安卓安装包（debug 签名，可直接安装）。
            - 安装：手机下载后允许「安装未知应用」即可。
            - 通知：装完请在系统设置里对该 App 关闭「电池优化」（设为不受限制），保证后台通知准时弹出。
            - 更新：网页/功能改动会随站点自动生效；只有改了原生壳才需重新下载此 APK 重装。
          files: web/eunoia.apk
          make_latest: true

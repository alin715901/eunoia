name: Build Android APK

# 推送到 main 或手动触发 → 构建 Vue 网页 → 同步进 Capacitor 安卓工程 → 编译 APK → 上传到 Releases
# 产物：GitHub Releases 里的 eunoia.apk（debug，可直接装到手机）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 用于创建/更新 Releases 与 tag
  issues: write     # 用于失败时将 gradle 报错写入诊断 Issue（调试期）

# 同一时间只跑一个 APK 构建，新的触发会取消排队中的旧任务
concurrency:
  group: apk-build
  cancel-in-progress: true

env:
  # 让 Gradle 步骤也能读到 Android SDK 路径（之前只在 license 步骤设，Gradle 步骤没拿到）
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    name: Build & Release APK
    # 固定 ubuntu-24.04：ubuntu-latest 已于 2026-10-19~11-19 迁移到 26.04，新镜像移除了预装的
    # Android SDK（/usr/local/lib/android/sdk）。本工作流依赖预装 SDK + sdkmanager，一旦落到
    # 26.04 会在「Set up Android SDK」步骤秒退。固定 24.04 锁定已知良好环境；下方 SDK 步骤另加
    # cmdline-tools 缺失兜底（现场下载），确保将来即使切到无预装 SDK 的镜像也不会静默失败。
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 20
        # 与本地构建环境（zulu 20）保持一致，消除 JDK 17/20 差异带来的不确定性
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 20

      - name: Cache Gradle dependencies
        # 关键修复：CI 每次都是全新 runner，首次需全量下载 AGP/Kotlin/androidx 等依赖，
        # 网络波动即超时导致 assembleDebug 偶发失败。缓存 ~/.gradle 后，第二次起复用依赖，
        # 基本杜绝此类超时（首次 cache miss 仍可能失败，多跑一次即可）。
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdk20-v2-${{ hashFiles('web/android/**/*.gradle*', 'web/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jdk20-v2-
            ${{ runner.os }}-gradle-

      - name: Install web dependencies
        run: npm ci

      - name: Build web (relative base for APK)
        # build:apk = vite build --base=./ + 写入 version.json，路径用相对基，适配 Capacitor 加载
        env:
          # Fork 后自动指向自己的仓库，应用内检查更新不会拉到原作者的 APK
          VITE_RELEASE_REPO: ${{ github.repository }}
          VITE_MUSIC_PROXY: ${{ vars.VITE_MUSIC_PROXY }}
          VITE_TRACE_URL: ${{ vars.VITE_TRACE_URL }}
          VITE_APK_PROXY: ${{ vars.VITE_APK_PROXY }}
        run: npm run build:apk

      - name: Sync web build + native plugins into android project
        # 必须用 cap sync（= copy + update），不能用 cap copy：
        # android/.gitignore 忽略了 capacitor-cordova-android-plugins 整个目录（含 cordova.variables.gradle），
        # 只有 sync 才会从 node_modules 重新生成该目录与插件 gradle 文件，否则 Gradle 配置阶段秒退。
        # 注意：cap sync 只拷贝 dist 并更新原生插件，不会重新构建网页，故 dist 的相对路径（./）不受影响。
        run: npx cap sync android

      - name: 兜底补齐插件注册（防 cap sync 漏写 settings/build.gradle 致配置阶段失败）
        # 根因：app/build.gradle 手动引用了 :capacitor-browser，但 cap sync 偶尔不会把它写进被 git
        # 跟踪的 capacitor.settings.gradle（与 HEAD 陈旧版本叠加），导致 Gradle 配置阶段报
        # "Project with path ':capacitor-browser' could not be found" 而构建失败。
        # 这里扫描 node_modules/@capacitor 下实际已安装（含 android 子目录）的插件，自动构造正确的
        # project 名（:capacitor-<包名后缀>）与目录（../node_modules/@capacitor/<包名后缀>/android），
        # 确保 capacitor.settings.gradle 与 app/capacitor.build.gradle 都注册了它们，作为 cap sync 的兜底。
        run: |
          node -e '
            const fs=require("fs");
            const path=require("path");
            const capDir="node_modules/@capacitor";
            const entries=fs.readdirSync(capDir,{withFileTypes:true});
            const present=[];
            for(const e of entries){
              if(e.isDirectory() && fs.existsSync(path.join(capDir,e.name,"android"))){
                present.push(e.name);
              }
            }
            const sf="android/capacitor.settings.gradle";
            let s=fs.readFileSync(sf,"utf8");
            for(const name of present){
              const proj=":capacitor-"+name;
              if(!s.includes("include \x27"+proj+"\x27")){
                s+="\ninclude \x27"+proj+"\x27\nproject(\x27"+proj+"\x27).projectDir = new File(\x27../node_modules/@capacitor/"+name+"/android\x27)\n";
                console.log("settings 补齐 include "+proj);
              }
            }
            fs.writeFileSync(sf,s);
            const bf="android/app/capacitor.build.gradle";
            let b=fs.readFileSync(bf,"utf8");
            for(const name of present){
              const proj=":capacitor-"+name;
              if(!b.includes("project(\x27"+proj+"\x27)")){
                b=b.replace("dependencies {","dependencies {\n    implementation project(\x27"+proj+"\x27)");
                console.log("capacitor.build.gradle 补齐 implementation "+proj);
              }
            }
            fs.writeFileSync(bf,b);
            console.log("插件注册兜底完成："+present.map(n=>":capacitor-"+n).join(", "));
          '

      - name: Set up Android SDK (accept licenses + install platform 34 / build-tools)
        # 关键修复：先真正接受全部许可证，再显式安装 compileSdk 34 所需的 platform 与 build-tools，
        # 避免 Gradle 配置阶段因「许可证未接受 / SDK 包缺失」秒退（表现为 45s 左右红叉）。
        # 兜底：若镜像未预装 cmdline-tools（如未来的 ubuntu-26.04 移除了预装 Android SDK），
        # 则现场下载并解压 commandlinetools，保证 sdkmanager 一定可用。
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "未检测到预装 cmdline-tools，现场安装 Android commandlinetools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          fi
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 准备 APK 签名密钥
        # 推荐把私钥放进 Secret（仓库里不放密钥文件）：把 keystore 的 base64 存为
        # EUNOIA_KEYSTORE_BASE64。未配置时回退到仓库内的公开演示密钥，
        # 保证 Fork 后零配置也能出包，且签名不变、可原地覆盖升级。
        env:
          KEYSTORE_B64: ${{ secrets.EUNOIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/eunoia.keystore
            echo "使用 Secret 中的签名密钥"
          else
            echo "未配置 EUNOIA_KEYSTORE_BASE64，使用仓库内的公开演示密钥"
          fi

      - name: Sync version into build.gradle (versionName + 单调递增 versionCode)
        run: |
          node -e "
            const fs=require('fs');
            const s=fs.readFileSync('src/utils/version.js','utf8');
            const m=s.match(/APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);
            const ver=(m?m[1]:'v0.0.0').replace(/^v/,'');
            const [maj,min,pat]=ver.split('.').map(n=>parseInt(n,10)||0);
            // 单调递增且唯一：major*10000+minor*100+patch（minor/patch<100 内恒增）
            const code=maj*10000+min*100+pat;
            const g='android/app/build.gradle';
            let t=fs.readFileSync(g,'utf8');
            t=t.replace(/versionCode\s+\d+/, 'versionCode '+code);
            t=t.replace(/versionName\s+\"[^\"]*\"/, 'versionName \"'+ver+'\"');
            fs.writeFileSync(g,t);
            console.log('build.gradle -> versionName='+ver+' versionCode='+code);
          "

      - name: 预下载 Gradle 依赖（预热缓存，隔离网络抖动）
        # CI 全新 runner 首次要下载 AGP/Kotlin/androidx 等大量依赖，网络一波动就超时。
        # 单独用一步把它们下载进 ~/.gradle 缓存，与真正的编译解耦；即使本步偶发失败也放行，
        # 真正的 assembleDebug 会复用已下载部分继续。超时已放大到 60 分钟 + 多次重试。
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:dependencies --no-daemon || echo "预下载未完全完成（容忍），正式构建会继续下载"

      - name: Build APK (debug)
        env:
          EUNOIA_STORE_PASSWORD: ${{ secrets.EUNOIA_STORE_PASSWORD }}
          EUNOIA_KEY_PASSWORD: ${{ secrets.EUNOIA_KEY_PASSWORD }}
          EUNOIA_KEY_ALIAS: ${{ secrets.EUNOIA_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          # 重试循环：应对 CI 全新 runner 首次下载依赖时的偶发网络抖动。
          # 注意：gradle 输出先落盘再用 $? 判断真实退出码，绝不要写成 `./gradlew | tee` 后用 if 判断
          # （管道会让 if 拿到 tee 的退出码，恒为 0，导致 gradle 实际失败时也被误判为成功）。
          ok=0
          rm -f /tmp/gradle.log
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试 assembleDebug ==="
            # 注意：先把 gradle 输出落盘到 /tmp/gradle.log（便于失败时排查），再用 $? 判断 gradle 真实退出码；
            # 不要写成 `./gradlew | tee` 再用 if 判断——管道会让 if 拿到 tee 的退出码（恒为 0），
            # 导致 gradle 实际失败时也被误判为成功。
            ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/gradle.log 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              ok=1
              echo "构建成功"
              break
            fi
            echo "第 $i 次构建失败（gradle 退出码 $rc），30s 后重试..."
            sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            echo "三次构建均失败，终止"
            exit 1
          fi

      - name: Surface build failure log (diagnostics)
        # 安全网：GitHub 的原始 CI 日志需 admin 权限才能下载（匿名 403），故把 gradle 失败日志写到
        # 公开的 GitHub Issue（ci-diag 标签），始终复用同一个 Issue（先查后建/更新），失败时即可直接
        # 读到真实报错，避免再次陷入「盲猜十几轮」的困境。正常构建不会触发本步骤。
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_number }}
        run: |
          {
            echo "CI APK build failure diagnostics — run #$RUN ($(date -u))"
            echo
            echo "=== tail of gradle log ==="
            tail -n 150 /tmp/gradle.log 2>/dev/null || echo "(no gradle.log captured)"
          } > /tmp/diag.txt
          BODY=$(python3 -c "import json,sys; print(json.dumps(open('/tmp/diag.txt').read()))")
          EXIST=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/alin715901/eunoia/issues?state=open&labels=ci-diag" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" 2>/dev/null)
          if [ -n "$EXIST" ]; then
            curl -s -X PATCH -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" -d "{\"body\":$BODY}" \
              "https://api.github.com/repos/alin715901/eunoia/issues/$EXIST" >/dev/null
            echo "updated diagnostic issue #$EXIST"
          else
            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" -d "{\"title\":\"CI APK build diagnostics\",\"body\":$BODY,\"labels\":[\"ci-diag\"]}" \
              "https://api.github.com/repos/alin715901/eunoia/issues" >/dev/null
            echo "created diagnostic issue"
          fi

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk eunoia.apk

      - name: Read app version (from source of truth)
        id: appver
        run: |
          VER=$(node -e "const fs=require('fs');const s=fs.readFileSync('src/utils/version.js','utf8');const m=s.match(/APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);process.stdout.write(m?m[1]:'v0.0.0')")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases (rolling latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appver.outputs.version }}
          name: Eunoia APK ${{ steps.appver.outputs.version }}（最新）
          body: |
            🤖 自动构建的安卓安装包（debug 签名，可直接安装）。

            - 安装：手机下载后允许「安装未知应用」即可。
            - 通知：装完请在系统设置里对该 App 关闭「电池优化」（设为不受限制），保证后台通知准时弹出。
            - 更新：应用内检测到新版本会弹窗提示，点「前往更新」即可下载安装；选「暂不更新」则继续使用当前版本。
          files: web/eunoia.apk
          make_latest: true

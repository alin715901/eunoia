name: Build Android APK

# 推送到 main 或手动触发 → 构建 Vue 网页 → 同步进 Capacitor 安卓工程 → 编译 APK → 上传到 Releases
# 产物：GitHub Releases 里的 eunoia.apk（debug，可直接装到手机）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 用于创建/更新 Releases 与 tag

# 同一时间只跑一个 APK 构建，新的触发会取消排队中的旧任务
concurrency:
  group: apk-build
  cancel-in-progress: true

env:
  # 让 Gradle 步骤也能读到 Android SDK 路径（之前只在 license 步骤设，Gradle 步骤没拿到）
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle dependencies
        # 关键修复：CI 每次都是全新 runner，首次需全量下载 AGP/Kotlin/androidx 等依赖，
        # 网络波动即超时导致 assembleDebug 偶发失败。缓存 ~/.gradle 后，第二次起复用依赖，
        # 基本杜绝此类超时（首次 cache miss 仍可能失败，多跑一次即可）。
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('web/android/**/*.gradle*', 'web/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install web dependencies
        run: npm ci

      - name: Build web (relative base for APK)
        # build:apk = vite build --base=./ + 写入 version.json，路径用相对基，适配 Capacitor 加载
        env:
          # Fork 后自动指向自己的仓库，应用内检查更新不会拉到原作者的 APK
          VITE_RELEASE_REPO: ${{ github.repository }}
          VITE_MUSIC_PROXY: ${{ vars.VITE_MUSIC_PROXY }}
          VITE_TRACE_URL: ${{ vars.VITE_TRACE_URL }}
          VITE_APK_PROXY: ${{ vars.VITE_APK_PROXY }}
        run: npm run build:apk

      - name: Sync web build + native plugins into android project
        # 必须用 cap sync（= copy + update），不能用 cap copy：
        # android/.gitignore 忽略了 capacitor-cordova-android-plugins 整个目录（含 cordova.variables.gradle），
        # 只有 sync 才会从 node_modules 重新生成该目录与插件 gradle 文件，否则 Gradle 配置阶段秒退。
        # 注意：cap sync 只拷贝 dist 并更新原生插件，不会重新构建网页，故 dist 的相对路径（./）不受影响。
        run: npx cap sync android

      - name: 兜底补齐插件注册（防 cap sync 漏写 settings/build.gradle 致配置阶段失败）
        # 根因：app/build.gradle 手动引用了 :capacitor-browser，但 cap sync 偶尔不会把它写进被 git
        # 跟踪的 capacitor.settings.gradle（与 HEAD 陈旧版本叠加），导致 Gradle 配置阶段报
        # "Project with path ':capacitor-browser' could not be found" 而构建失败。
        # 这里扫描 node_modules/@capacitor 下实际已安装（含 android 子目录）的插件，自动构造正确的
        # project 名（:capacitor-<包名后缀>）与目录（../node_modules/@capacitor/<包名后缀>/android），
        # 确保 capacitor.settings.gradle 与 app/capacitor.build.gradle 都注册了它们，作为 cap sync 的兜底。
        run: |
          node -e '
            const fs=require("fs");
            const path=require("path");
            const capDir="node_modules/@capacitor";
            const entries=fs.readdirSync(capDir,{withFileTypes:true});
            const present=[];
            for(const e of entries){
              if(e.isDirectory() && fs.existsSync(path.join(capDir,e.name,"android"))){
                present.push(e.name);
              }
            }
            const sf="android/capacitor.settings.gradle";
            let s=fs.readFileSync(sf,"utf8");
            for(const name of present){
              const proj=":capacitor-"+name;
              if(!s.includes("include \x27"+proj+"\x27")){
                s+="\ninclude \x27"+proj+"\x27\nproject(\x27"+proj+"\x27).projectDir = new File(\x27../node_modules/@capacitor/"+name+"/android\x27)\n";
                console.log("settings 补齐 include "+proj);
              }
            }
            fs.writeFileSync(sf,s);
            const bf="android/app/capacitor.build.gradle";
            let b=fs.readFileSync(bf,"utf8");
            for(const name of present){
              const proj=":capacitor-"+name;
              if(!b.includes("project(\x27"+proj+"\x27)")){
                b=b.replace("dependencies {","dependencies {\n    implementation project(\x27"+proj+"\x27)");
                console.log("capacitor.build.gradle 补齐 implementation "+proj);
              }
            }
            fs.writeFileSync(bf,b);
            console.log("插件注册兜底完成："+present.map(n=>":capacitor-"+n).join(", "));
          '

      - name: Set up Android SDK (accept licenses + install platform 34 / build-tools)
        # 关键修复：先真正接受全部许可证，再显式安装 compileSdk 34 所需的 platform 与 build-tools，
        # 避免 Gradle 配置阶段因「许可证未接受 / SDK 包缺失」秒退（表现为 45s 左右红叉）。
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 准备 APK 签名密钥
        # 推荐把私钥放进 Secret（仓库里不放密钥文件）：把 keystore 的 base64 存为
        # EUNOIA_KEYSTORE_BASE64。未配置时回退到仓库内的公开演示密钥，
        # 保证 Fork 后零配置也能出包，且签名不变、可原地覆盖升级。
        env:
          KEYSTORE_B64: ${{ secrets.EUNOIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/eunoia.keystore
            echo "使用 Secret 中的签名密钥"
          else
            echo "未配置 EUNOIA_KEYSTORE_BASE64，使用仓库内的公开演示密钥"
          fi

      - name: Sync version into build.gradle (versionName + 单调递增 versionCode)
        run: |
          node -e "
            const fs=require('fs');
            const s=fs.readFileSync('src/utils/version.js','utf8');
            const m=s.match(/APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);
            const ver=(m?m[1]:'v0.0.0').replace(/^v/,'');
            const [maj,min,pat]=ver.split('.').map(n=>parseInt(n,10)||0);
            // 单调递增且唯一：major*10000+minor*100+patch（minor/patch<100 内恒增）
            const code=maj*10000+min*100+pat;
            const g='android/app/build.gradle';
            let t=fs.readFileSync(g,'utf8');
            t=t.replace(/versionCode\s+\d+/, 'versionCode '+code);
            t=t.replace(/versionName\s+\"[^\"]*\"/, 'versionName \"'+ver+'\"');
            fs.writeFileSync(g,t);
            console.log('build.gradle -> versionName='+ver+' versionCode='+code);
          "

      - name: Build APK (debug)
        env:
          EUNOIA_STORE_PASSWORD: ${{ secrets.EUNOIA_STORE_PASSWORD }}
          EUNOIA_KEY_PASSWORD: ${{ secrets.EUNOIA_KEY_PASSWORD }}
          EUNOIA_KEY_ALIAS: ${{ secrets.EUNOIA_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --network-timeout 900000

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk eunoia.apk

      - name: Read app version (from source of truth)
        id: appver
        run: |
          VER=$(node -e "const fs=require('fs');const s=fs.readFileSync('src/utils/version.js','utf8');const m=s.match(/APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);process.stdout.write(m?m[1]:'v0.0.0')")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases (rolling latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appver.outputs.version }}
          name: Eunoia APK ${{ steps.appver.outputs.version }}（最新）
          body: |
            🤖 自动构建的安卓安装包（debug 签名，可直接安装）。

            - 安装：手机下载后允许「安装未知应用」即可。
            - 通知：装完请在系统设置里对该 App 关闭「电池优化」（设为不受限制），保证后台通知准时弹出。
            - 更新：应用内检测到新版本会弹窗提示，点「前往更新」即可下载安装；选「暂不更新」则继续使用当前版本。
          files: web/eunoia.apk
          make_latest: true
